{% load crispy_forms_tags %}

<form action="{% url 'moderator-contribution-reject' contribution.pk %}" method="POST" id="rejectionForm">
    {% csrf_token %}

    <div class="form-group m-2"> <!-- style="float: left;"-->
        <label for="id_last_rejection_reason">Please write the <span class='font-weight-bold'>reason</span> why you reject this Contribution.</label>
        {{ form.last_rejection_reason }}
    </div>

</form>
