{% extends "rivercureportal/base.html" %}
{% load crispy_forms_tags %}

{% block content %}

<h1>Sensors in Context X</h1>
<div class="content-section">
<form method="get">
  {{ filter.form |crispy }}
  <button type="button" class="btn btn-info">Filter</button>
</form>
</div>

{% for context_sensor in filter.qs %}
<article class="media content-section">
    <div class="media-body">
      <div class="article-metadata">
        <a class="mr-2" href="#">{{ context_sensor.code }}</a>
      </div>
      <p><a class="article-title" >{{ context_sensor.type }}</a></p>
    </div>
</article>
{% endfor %}


{% endblock content %}
