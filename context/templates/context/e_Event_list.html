{% extends "rivercureportal/base.html" %}
{% load crispy_forms_tags %}

{% block content %}

<h1>Events</h1>
<div class="filter-section">
<h5>Filter</h5> 
<form method="get">
  {{ filter.form |crispy }}
  <button type="button" class="btn btn-info">Filter</button>
</form>
</div>

{% for event in filter.qs %}
<article class="media content-section">
    <div class="media-body">
      <div class="article-metadata">
        <a class="mr-2" href="{% url 'event-detail' event.pk %}">{{ event.Name }}</a>
      </div>
      <p><a class="article-title" >{{ event.type }}</a></p>
    </div>
</article>
{% endfor %}


{% endblock content %}
