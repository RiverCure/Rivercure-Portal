{% extends "Rivercureportal/base.html" %}
{% load crispy_forms_tags %}
{% load leaflet_tags %}
{% load static %}


{% block content %}
    <h1><small>Upload your context here</small></h1>
    <div id="form-data" class="content-section">
        <form method='POST' enctype="multipart/form-data">
            {% csrf_token %}
            {{ form|crispy }}
            <div class="form-group">
                <button id="submit-btn" class="btn btn-outline-info" type="submit">Upload</button>
            </div>
        </form>
        <div class="border-top pt-3">
        </div>
    </div>
    
{% endblock %}
