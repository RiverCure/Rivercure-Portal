{% extends "rivercureportal/base.html" %} {% block title %} Organization delete {% endblock %} {% load static %} {% block content %}
<div class="content-section">
  <form method="POST">
    {% csrf_token %}
    <fieldset class="form-group">
      <legend class="border-bottom mb-4">Delete {{organization.name}}</legend>
      <h2>Are you sure you want to delete the organization {{organization.name}}?</h2>
    </fieldset>
    <div class="form-group">
      <button class="btn btn-outline-danger" type="submit">Yes, delete</button>
      <a class="btn btn-outline-secondary" href="{% url 'organization-detail' organization.pk %}">Cancel</a>
    </div>
  </form>
</div>

{% endblock content %}
