{% extends "rivercureportal/base.html" %}

{% block content %}

<article class="media content-section">
    <div class="media-body">
      <div class="article-metadata">
        <a class="mr-2" href="#">{{ object.Name }}</a>
      </div>
      {% if perms.sensors.change_e_sensor %}
        <a class="btn btn-secondary btn-sm mt-1 mb-1" href="#" > Update</a>
        <a class="btn btn-danger btn-sm mt-1 mb-1" href="#" > Delete</a>
      {% endif %}
      <p class="article-content">Code: {{ object.name }}</p></p>
      <p class="article-content">Area: {{ object.geom }}</p>
    </div>
</article>


{% endblock content %}
