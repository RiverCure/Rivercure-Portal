{% extends "rivercureportal/base.html" %}
{% load crispy_forms_tags %}

{% block content %}

<h1>Sensors</h1>


<div class="filter-section">
<h5>Filter</h5> 

<form method="get">
  {{ filter.form |crispy }}
  <button type="submit" class="btn btn-info">Filter</button>
</form>
</div>

{% for sensor in filter.qs %}
<article class="media content-section">
    <div class="media-body">
      <div class="article-metadata">
        <a class="mr-2" href="{% url 'sensor-detail' sensor.code %}">{{ sensor.Name }}</a>
      </div>
      <p><a class="article-title" >Type: {{ sensor.type }}</a></p>
      <p><a class="article-title" >Modality type: {{ sensor.modalityType}}</a></p>
      <a class="btn btn-secondary btn mt-1 mb-1" href="{% url 'sensor-observations' %}?query={{sensor.Name}}" style='float:right'> Observations</a>
    </div>
</article>
{% endfor %}

{% endblock content %}
