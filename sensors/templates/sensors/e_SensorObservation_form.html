{% extends "rivercureportal/base.html" %}
{% load crispy_forms_tags %}
{% load static %}



{% block content %}
    <div class="content-section">
        <form method='POST'>
            {% csrf_token %}
            <fieldset class="form-group">
                <legend class="border-bottom mb-4">Create an Observation</legend>
                {{ form|crispy }}
            </fieldset>
            <div class="form-group">
                <button class="btn btn-outline-info" type="submit" href="{% url 'sensor-observation-detail' observation.id %}">Save</button>
                <a class="btn btn-outline-secondary" href="{% url 'sensor-observation-detail' observation.id %}">Cancel</a>
            </div>
        </form>
    </div>
    
{% endblock content %}
