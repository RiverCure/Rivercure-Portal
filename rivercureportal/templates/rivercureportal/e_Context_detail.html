{% extends "rivercureportal/base.html" %}

{% block content %}

<article class="media content-section">
    <div class="media-body">
      <h2 class="article-title">{{object.Name}}</h2>
      <p class="article-content">Code: {{ object.code }}</p>
    
    <h2>Events</h2>
    {% for event in object.e_ContextEvent %}
   
    <p class="article-content"> {{event.type}} </p> 

    {% endfor %}
    </div>
</article>




{% endblock content %}
