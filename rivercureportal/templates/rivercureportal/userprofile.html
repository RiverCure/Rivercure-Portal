{% extends "rivercureportal/base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="content-section">
    <div class="media">
      <img class="rounded-circle account-img" src="{{ user.profile.image.url }}">
      <div class="media-body">
        <h2 class="account-heading">{{u.username}}</h2>
        <p class="text-primary">{{u.profile.institution}}</p>
        <p class="text-primary">{{u.profile.first_name}} {{u.profile.last_name}}</p>
        <p class="text-primary">Roles: {{u.groups.values}}</p>
      </div>
    </div>
  </div>

 
{% endblock content %}
