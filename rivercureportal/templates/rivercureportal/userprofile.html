{% extends "rivercureportal/base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="content-section">
    <div class="media">
      <img class="rounded-circle account-img" src="{{ u.profile.image.url }}">
      <div class="media-body">
        <div class="col-sm-6 col-md-8">
          <h4>{{u.profile.first_name}} {{u.profile.last_name}} ({{u.username}})</h4>
         <b>E-mail:</b>{{u.email}}<br>
      </div>
      </div>
    </div>
    <a href="{% url 'users' %}" type="button" class="btn btn-secondary">Back</a>
  </div>
  
{% endblock content %}
