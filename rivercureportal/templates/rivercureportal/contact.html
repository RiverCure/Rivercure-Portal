{% extends "rivercureportal/base.html" %}
{% block title %} Contact {% endblock %}
{% load crispy_forms_tags %}
{% load auth_extras %}
{% load static %}



{% block content %}

<h1>Contact Us</h1>
<hr>

<form method="POST">
    {% csrf_token %}

    {{ form|crispy }}

    <button type="submit" class="btn btn-outline-info mb-3">
        Send
    </button>
</form>

{% endblock %}
