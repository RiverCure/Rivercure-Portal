{% extends "rivercureportal/base.html" %}

{% block content %}

<h1>Rivercure Team</h1>

{% for user in users %}
<article class="media content-section">
    <div class="media-body">
        <a class="mr-2">{{ user.profile.first_name }} {{ user.profile.last_name }}</a>
    </div>

<div class="media-article">
  <img class="article-img" src="{{ user.profile.image.url }}"></img>
</div>
</article>
{% endfor %}

{% endblock content %}
