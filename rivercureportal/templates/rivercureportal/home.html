{% extends "rivercureportal/base.html" %}

{% block content %}

<h1>Contexts</h1>

{% for context in contexts %}
<article class="media content-section">
    <div class="media-body">
      <div class="article-metadata">
        <a class="mr-2" href="{% url 'context-detail' context.code %}">{{ context.Name }}</a>
      </div>
      <p><a class="article-title" >{{ context.code }}</a></p>
    </div>
</article>
{% endfor %}

{% endblock content %}
